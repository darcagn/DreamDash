# Autoboot applications if found
AUTOBOOT = 0

# Wallpaper name
# - `lite`
# - `dark`
WALLPAPER_NAME = lite

# Wallpaper size - Large wallpapers use lots of space
# - `128`
# - `256`
# - `512`
WALLPAPER_SIZE = 256

# Include support for launching discs
DISC_SUPPORT = 1

# Choose a FAT filesystem library:
# - `kosfat` for libkosfat (built into KOS)
# - `fatfs` for FatFS (addon library)
FAT_LIBRARY = fatfs

# Use Dreamcast's BIOS font instead of bitmap font
ROMFONT = 1

# The name of the bitmap font to be used, if enabled
BMFONT_NAME = ebdragon

# Set this to disable DreamDash's log function and use
# dcload-ip/serial console instead. Log menu item will
# not appear on the main menu.
DISABLE_LOGGER = 0
